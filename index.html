<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Chud SMP</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: grid;
            place-items: center;

            background: #0b0f19;
            color: #f5f7fb;
        }

        .card {
            width: min(440px, calc(100% - 32px));
            padding: 34px;

            border: 1px solid #273148;
            border-radius: 20px;

            background: #151b29;
            box-shadow: 0 24px 80px #0008;

            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
        }

        .sub {
            margin: 0 0 28px;
            color: #8f9bb2;
        }

        button {
            width: 100%;

            border: 0;
            border-radius: 12px;

            padding: 16px;

            background: #5865f2;
            color: white;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            min-height: 24px;
            margin-top: 18px;

            line-height: 1.45;
            color: #9aa6bc;
        }

        .success {
            color: #57f287 !important;
        }

        .error {
            color: #ff6b6b !important;
        }
    </style>
</head>

<body>

    <main class="card">

        <h1>MSH Control</h1>

        <p class="sub">
            Server ID: <strong>a096491e</strong>
        </p>

        <button id="activate">
            Start Server
        </button>

        <div
            id="status"
            role="status"
            aria-live="polite"
        ></div>

    </main>

    <script src="./config.js"></script>

    <script>
        const button = document.getElementById("activate");
        const status = document.getElementById("status");

        button.addEventListener("click", async () => {

            // Make sure the Worker URL is configured.
            if (!WORKER_URL) {
                status.className = "error";
                status.textContent = "Worker URL is not configured.";
                return;
            }

            // Disable the button while activation is in progress.
            button.disabled = true;
            button.textContent = "Activating…";

            status.className = "";
            status.textContent = "Checking server…";

            try {
                const r = await fetch(
                    WORKER_URL.replace(/\/+$/, "") + "/msh-start",
                    {
                        method: "POST"
                    }
                );

                const d = await r
                    .json()
                    .catch(() => ({
                        success: false,
                        message: "Invalid Worker response."
                    }));

                if (!r.ok || !d.success) {
                    throw new Error(
                        d.message || "Activation failed."
                    );
                }

                status.className = "success";
                status.textContent =
                    "✓ Server started successfully.";

            } catch (e) {

                status.className = "error";
                status.textContent =
                    "✕ " + (e.message || "Activation failed.");

            } finally {

                // Restore the button after the request finishes.
                button.disabled = false;
                button.textContent = "Start Server";
            }
        });
    </script>

</body>
</html>
